name: Record Codex contributor

on:
  push:
    branches:
      - "codex/contributor-record"

permissions:
  contents: write

jobs:
  record:
    name: Create attributed contribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Commit contributor record as Codex
        run: |
          cat > CONTRIBUTORS.md <<'EOF'
          # Contributors

          Rufus Linux is led by NitroDiesel and developed with contributors
          recorded in the repository's Git history. GitHub Insights remains the
          authoritative complete contributor list.

          ## AI-assisted engineering

          [ChatGPT Codex](https://github.com/apps/chatgpt-codex-connector)
          materially contributed to the Linux port's architecture, safety
          hardening, native UI, hot-plug behavior, packaging, AppImage release
          path, verification, and agent handoff documentation.

          AI contribution credit reflects reviewed changes merged into the
          project; it does not imply ownership of Rufus or affiliation with the
          upstream Rufus maintainers.
          EOF

          rm .github/workflows/record-codex-contributor.yml
          git config user.name "Codex"
          git config user.email             "199175422+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md .github/workflows/record-codex-contributor.yml
          git commit             -m "Record Codex as a project contributor"             -m "Co-authored-by: chatgpt-codex-connector[bot] <199175422+chatgpt-codex-connector[bot]@users.noreply.github.com>"
          git push origin "HEAD:${GITHUB_REF_NAME}"
