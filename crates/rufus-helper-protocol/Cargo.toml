[package]
name = "rufus-helper-protocol"
description = "Versioned IPC messages between the desktop app and privileged helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
rufus-core = { path = "../rufus-core", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
