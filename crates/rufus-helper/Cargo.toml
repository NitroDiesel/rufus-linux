[package]
name = "rufus-helper"
description = "Privileged helper for raw-device operations (polkit-authorized)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "rufus-linux-helper"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rufus-core = { path = "../rufus-core", features = ["serde"] }
rufus-helper-protocol = { path = "../rufus-helper-protocol" }
rufus-linux-platform = { path = "../rufus-linux-platform" }
thiserror = "2"
fs2 = "0.4"
sha2 = "0.10"
libc = "0.2"
rufus-image = { path = "../rufus-image" }
zbus = { version = "4.4", default-features = false, features = ["async-io"] }

[dev-dependencies]
rufus-image = { path = "../rufus-image", features = ["fixtures"] }
